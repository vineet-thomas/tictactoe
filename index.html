<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <!-- CORRECT PATH: CSS is in same folder -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>TIC-TAC-TOE</h1>
        <p class="subtitle">Make three in a row to win the game!</p>
        
        <div class="scoreboard">
            <div class="player player-x active">
                <div class="symbol">X</div>
                <div class="name">Player X</div>
                <div class="score" id="playerXScore">0</div>
            </div>
            <div class="player player-o">
                <div class="symbol">O</div>
                <div class="name">Player O</div>
                <div class="score" id="playerOScore">0</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="game-status" id="gameStatus">Player X's turn</div>
        
        <button class="restart-btn" id="restartBtn">New Game</button>
    </div>

    <!-- CORRECT PATH: JS is in same folder -->
    <script src="script.js"></script>
</body>
</html>
